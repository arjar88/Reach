name: ci
on:
  pull_request:
  push:
    branches: [core, main]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reach
          POSTGRES_PASSWORD: reach
          POSTGRES_DB: reach_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reach -d reach_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_SESSION: postgres://reach:reach@127.0.0.1:5432/reach_test
      DATABASE_URL_POOLED: postgres://reach:reach@127.0.0.1:5432/reach_test
      REDIS_URL: redis://127.0.0.1:6379
      SIGNING_SECRET: ci-signing-secret
      APP_URL: http://localhost:3000
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Redis noeviction
        run: redis-cli CONFIG SET maxmemory-policy noeviction
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
